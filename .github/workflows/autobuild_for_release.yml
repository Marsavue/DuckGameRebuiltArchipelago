name: Build, Zip, and Release

on:
  release:
    branches: [ "master" ]
    types: [published]

jobs:
  build_and_release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MSBuild
        run: |
          sudo apt-get update
          sudo apt-get install -y msbuild

      - name: Restore NuGet packages
        run: nuget restore .

      - name: Add Project Dependencies [#1]
        run: |
          mkdir ./bin
          cp ./DuckGame/lib/* ./bin
          
      - name: Build without AutoUpdater
        run: msbuild /m /p:Configuration=Release .

      - name: Zip binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          chmod +x bin/DuckGame.sh
          mv ./bin ./DuckGameArchipelago
          cd ./DuckGameArchipelago && zip -r ../DuckGameArchipelago.zip ./* && cd ..

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./DuckGameArchipelago.zip
          overwrite: true
